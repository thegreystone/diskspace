name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger from the Actions tab. Same matrix runs (Linux + macOS + Windows
  # native builds), artifacts are uploaded as workflow artifacts, but no GitHub
  # Release is created and macOS Developer ID signing/notarization is skipped
  # (an ad-hoc signed DMG is produced instead). Use this to verify the release
  # build end-to-end without publishing or burning notarization quota. Artifacts
  # download from the workflow run page; version label keeps the pom's -SNAPSHOT
  # suffix to keep them visibly distinct from real releases.
  workflow_dispatch:

jobs:
  # ── Native images, one per release platform ──────────────────────────
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,  suffix: linux-x86_64,   exe: DiskSpace }
          - { os: macos-15,      suffix: macos-aarch64,  exe: DiskSpace }
          - { os: windows-2022,  suffix: windows-x86_64, exe: DiskSpace.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Install Linux C toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Tag push: rewrite pom version to match the tag (e.g. v0.3.4 → 0.3.4) so
      # downstream artifact names line up with the release. workflow_dispatch:
      # leave the pom version untouched (e.g. 0.3.4-SNAPSHOT) so dispatched
      # artifacts are visibly distinct from real release artifacts.
      - name: Set version from tag
        if: github.event_name == 'push'
        shell: bash
        run: mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      # Single source of truth for the artifact-name version. Tag push strips the
      # leading `v`; dispatch reads the (now possibly -SNAPSHOT) pom version.
      - name: Compute artifact version
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            VER=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
            echo "VERSION=${VER}" >> "$GITHUB_ENV"
          fi

      - name: Native build
        run: mvn -B -Pnative -DskipTests clean package

      - name: Stage Linux / Windows binary
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          SRC="target/native/${{ matrix.exe }}"
          test -f "$SRC"
          if [ "${{ matrix.exe }}" = "DiskSpace.exe" ]; then
            DST="target/diskspace-${VERSION}-${{ matrix.suffix }}.exe"
          else
            DST="target/diskspace-${VERSION}-${{ matrix.suffix }}"
          fi
          cp "$SRC" "$DST"

      # Windows: only the bare .exe is built+uploaded here, unsigned. The Inno Setup
      # installer is built locally by scripts/sign-release.ps1 *after* the bare .exe
      # has been signed — that way the installer wraps a signed binary, not an
      # unsigned one (which AV/SmartScreen would flag once extracted to Program
      # Files). Certum SimplySign needs an OTP-from-phone step that doesn't have a
      # clean headless path on GitHub-hosted runners, so signing + installer build
      # both happen on the maintainer's machine. See docs/DEVGUIDE.md
      # § Signing Windows artifacts.

      - name: Assemble ad-hoc signed DMG (macOS dispatch)
        if: runner.os == 'macOS' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          bash scripts/package-macos.sh \
            --version "$VERSION" \
            --output-dir target \
            --dmg-name "diskspace-${VERSION}-${{ matrix.suffix }}.dmg"

      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS' && github.event_name == 'push'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          KEYCHAIN_PWD=$(openssl rand -base64 32)
          echo "KEYCHAIN_PWD=$KEYCHAIN_PWD" >> "$GITHUB_ENV"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN_PATH" \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

      - name: List signing identities (macOS)
        if: runner.os == 'macOS' && github.event_name == 'push'
        shell: bash
        run: security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain"

      - name: Assemble, sign, notarize and package DMG (macOS)
        if: runner.os == 'macOS' && github.event_name == 'push'
        shell: bash
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          DMG="target/diskspace-${VERSION}-${{ matrix.suffix }}.dmg"
          bash scripts/package-macos.sh \
            --version "$VERSION" \
            --output-dir target \
            --dmg-name "diskspace-${VERSION}-${{ matrix.suffix }}.dmg" \
            --sign-identity "$MACOS_SIGNING_IDENTITY" \
            --entitlements installer/entitlements.plist
          xcrun notarytool submit "$DMG" \
            --apple-id "$NOTARIZATION_APPLE_ID" \
            --password "$NOTARIZATION_PASSWORD" \
            --team-id "$NOTARIZATION_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Clean up keychain (macOS)
        if: runner.os == 'macOS' && github.event_name == 'push' && always()
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/build.keychain"

      - name: Upload native build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.suffix }}
          path: |
            target/native/**/*.log
            target/native/svm_err_*.md
          if-no-files-found: ignore

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.suffix }}
          path: |
            target/diskspace-*-${{ matrix.suffix }}
            target/diskspace-*-${{ matrix.suffix }}.exe
            target/diskspace-*-${{ matrix.suffix }}.dmg
          if-no-files-found: error

  # ── Create GitHub release with all artifacts ─────────────────────────
  # Only fires on tag push. workflow_dispatch stops at the per-platform
  # upload-artifact step above, so dispatched runs leave no GitHub Release
  # and no published assets — only workflow artifacts on the run page.
  release:
    if: github.event_name == 'push'
    needs: [ native ]
    runs-on: ubuntu-24.04
    # Only the release job needs write access (to create the GitHub Release and
    # attach assets). The native job runs with the workflow's default read-only
    # GITHUB_TOKEN — least privilege especially for manually dispatched runs.
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
