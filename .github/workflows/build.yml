name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── JVM compile + tests on a single Linux runner ─────────────────────
  jvm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Install JavaFX test runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgtk-3-0t64 libgl1 libxtst6

      - name: Build and test
        # JavaFX controls require a display even when no window is shown.
        run: xvfb-run --auto-servernum mvn -B package -DskipTests=false -Dprism.order=sw

  # ── Sanity-build native image on each release platform ───────────────
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04,  suffix: linux-x86_64,   exe: DiskSpace }
          - { os: macos-15,      suffix: macos-aarch64,  exe: DiskSpace }
          - { os: windows-2022,  suffix: windows-x86_64, exe: DiskSpace.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          version: '25.0.5.1' # Includes the MemorySegment optimization used by JavaFX Marlin.
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Install Linux C toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zlib1g-dev

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Native build
        run: mvn -B -Pnative -DskipTests clean package

      - name: Verify binary
        shell: bash
        run: |
          set -euo pipefail
          test -f "target/native/${{ matrix.exe }}"
          ls -lh "target/native/${{ matrix.exe }}"

      - name: Upload native build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.suffix }}
          path: |
            target/native/**/*.log
            target/native/svm_err_*.md
          if-no-files-found: ignore
